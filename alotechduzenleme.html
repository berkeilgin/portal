<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alotech Düzenleme | Özet & Detay Data</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    /* Ek stiller - düzenleme için */
    .file-item { display: flex; align-items: center; gap: 12px; background: var(--surface); padding: 10px 16px; border-radius: 14px; margin-bottom: 8px; border: 1px solid var(--border); flex-wrap: wrap; }
    .file-name { font-weight: 500; flex: 1; font-family: var(--mono); font-size: 13px; }
    .file-rows { font-size: 11px; color: var(--muted); background: var(--card2); padding: 2px 8px; border-radius: 20px; }
    .file-del { background: none; border: none; color: var(--accent3); font-size: 16px; cursor: pointer; font-weight: bold; opacity: 0.6; transition: 0.2s; }
    .file-del:hover { opacity: 1; transform: scale(1.1); }
    .preview-btn, .export-btn { font-size: 11px; padding: 4px 12px; }
    .preview-container { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; display: none; }
    .preview-container.active { display: block; }
    .section-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .stat-badge { font-size: 12px; background: var(--card2); padding: 6px 12px; border-radius: 40px; }
    .action-bar { margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px; }
    h2 { font-family: var(--display); font-weight: 700; letter-spacing: -0.3px; background: linear-gradient(135deg, var(--accent2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }
    .container, .main { max-width: 1400px; margin: 0 auto; padding: 24px; }
  </style>
</head>
<body class="grey">
  <div class="header">
    <div style="font-weight: 700; font-size: 1.4rem; font-family: var(--display);">📊 Alotech Düzenleme</div>
    <div class="theme-switch" id="themeSwitch">
      <button class="theme-btn" data-theme="grey">Gri</button>
      <button class="theme-btn" data-theme="dark">Koyu</button>
      <button class="theme-btn" data-theme="light">Açık</button>
      <button class="theme-btn" data-theme="tp">TP Neon</button>
    </div>
  </div>
  
  <div class="container">
    <div class="grid-2">
      <!-- Özet Data -->
      <div class="card" id="summaryZone">
        <div class="section-header">
          <h2>📑 Özet Data</h2>
          <div class="stat-badge" id="summaryStats">0 dosya, 0 satır</div>
        </div>
        <div class="drop-zone" id="summaryDropZone">
          📂 Dosyaları sürükle bırak veya tıkla seç (CSV / Excel)
          <input type="file" id="summaryFileInput" multiple accept=".csv,.xlsx,.xls" style="display:none">
        </div>
        <div id="summaryFileList" style="margin-top: 16px;"></div>
        <div style="margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end;">
          <button class="btn btn-ghost btn-sm" id="summaryExportAllBtn">📎 Tümünü Dışa Aktar</button>
        </div>
      </div>

      <!-- Detay Data -->
      <div class="card" id="detailZone">
        <div class="section-header">
          <h2>🔍 Detay Data</h2>
          <div class="stat-badge" id="detailStats">0 dosya, 0 satır</div>
        </div>
        <div class="drop-zone" id="detailDropZone">
          📂 Dosyaları sürükle bırak veya tıkla seç (CSV / Excel)
          <input type="file" id="detailFileInput" multiple accept=".csv,.xlsx,.xls" style="display:none">
        </div>
        <div id="detailFileList" style="margin-top: 16px;"></div>
        <div style="margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end;">
          <button class="btn btn-ghost btn-sm" id="detailExportAllBtn">📎 Tümünü Dışa Aktar</button>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-danger" id="resetAllBtn">🗑️ Tüm Verileri Sıfırla</button>
      <button class="btn btn-primary" id="calculateBtn">⚡ Hesaplamayı Başlat (Demo)</button>
    </div>
    <div id="globalStatus" class="status-bar"></div>
  </div>
  <div class="footer">
    <span>Veri yapısını ve içeriği olduğu gibi gösterir, dışa aktarır. Hesaplama motoru hazır.</span>
  </div>

  <script src="/js/alotechduzenleme.js"></script>
</body>
</html>
