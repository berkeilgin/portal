<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalite Case — QA Portal</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@700&family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<style>
/* Case'e özel stiller */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
}
.tab-btn {
  padding: 8px 20px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--font);
  font-size: 14px;
  border-radius: 20px;
  transition: .2s;
}
.tab-btn:hover {
  color: var(--text);
  background: rgba(255,255,255,.05);
}
.tab-btn.active {
  background: var(--accent2);
  color: #fff;
}
.tab-pane {
  display: none;
}
.tab-pane.active {
  display: block;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.cases-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
  margin-top: 20px;
}
.case-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  border-left: 4px solid var(--muted2);
  transition: .2s;
}
.case-card[data-status="beklemede"] { border-left-color: #9c27b0; }
.case-card[data-status="sürüyor"] { border-left-color: var(--accent4); }
.case-card[data-status="çözüldü"] { border-left-color: var(--accent); }
.case-card[data-status="reddedildi"] { border-left-color: var(--muted2); }
.case-title {
  font-family: var(--display);
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 6px;
}
.case-meta {
  font-size: 11px;
  color: var(--muted);
  font-family: var(--mono);
  margin-bottom: 8px;
}
.case-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 10px;
}
.badge-case {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--mono);
}
.badge-pend { background: rgba(156,39,176,.15); color: #ce93d8; border: 1px solid rgba(156,39,176,.3); }
.badge-prog { background: rgba(244,162,97,.15); color: var(--accent4); border: 1px solid rgba(244,162,97,.3); }
.badge-done { background: rgba(6,214,160,.15); color: var(--accent); border: 1px solid rgba(6,214,160,.3); }
.badge-rej { background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid var(--border); }
.badge-high { background: rgba(255,107,107,.15); color: var(--accent3); }
.badge-med { background: rgba(244,162,97,.15); color: var(--accent4); }
.badge-low { background: rgba(6,214,160,.15); color: var(--accent); }

.note-item {
  background: var(--card2);
  border-left: 3px solid var(--accent2);
  border-radius: 6px;
  padding: 8px 12px;
  margin-top: 8px;
  font-size: 11px;
}
.note-meta {
  font-size: 9px;
  color: var(--muted);
  font-family: var(--mono);
  margin-bottom: 3px;
}
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 600px) {
  .grid-2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="grey">

<div class="header">
  <div class="logo">📋 QA Portal</div>
  <div class="theme-switch"></div>
  <button class="btn btn-ghost" onclick="window.location.href='index.html'">← Ana Sayfa</button>
</div>

<div class="main">
  <div class="panel">
    <div class="sbadge">CASE SİSTEMİ</div>
    <div class="stitle">Kalite <em>Case</em></div>
    <div class="sdesc">Yeni talep, şikayet veya öneri oluşturun — Case ID veya e-posta ile sorgulayın.</div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="create">➕ Yeni Case</button>
      <button class="tab-btn" data-tab="query">🔍 Case Sorgula</button>
    </div>

    <!-- Yeni Case Tab -->
    <div class="tab-pane active" id="createTab">
      <div class="grid-2">
        <div class="form-group">
          <label>Adınız Soyadınız <span class="req">*</span></label>
          <input type="text" id="userFullname" class="form-input" placeholder="Ad Soyad">
        </div>
        <div class="form-group">
          <label>E-posta <span class="req">*</span></label>
          <input type="email" id="userEmail" class="form-input" placeholder="ornek@mail.com">
        </div>
        <div class="form-group">
          <label>Konu <span class="req">*</span></label>
          <select id="caseTopic" class="form-input"></select>
        </div>
        <div class="form-group">
          <label>Öncelik</label>
          <select id="casePriority" class="form-input">
            <option value="düşük">Düşük</option>
            <option value="orta" selected>Orta</option>
            <option value="yüksek">Yüksek</option>
          </select>
        </div>
        <div class="form-group full" style="grid-column:1/-1">
          <label>Başlık <span class="req">*</span></label>
          <input type="text" id="caseTitle" class="form-input" placeholder="Kısa başlık">
        </div>
        <div class="form-group full" style="grid-column:1/-1">
          <label>Açıklama <span class="req">*</span></label>
          <textarea id="caseDesc" rows="4" class="form-input" placeholder="Detaylı bilgi..."></textarea>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="createCase()">📤 Case Gönder</button>
      </div>
      <div class="status-bar" id="createStatus"></div>
    </div>

    <!-- Sorgula Tab -->
    <div class="tab-pane" id="queryTab">
      <div class="grid-2">
        <div class="form-group">
          <label>Case ID</label>
          <input type="text" id="queryCaseId" class="form-input" placeholder="Örn: abc123">
        </div>
        <div class="form-group">
          <label>E-posta Adresiniz</label>
          <input type="email" id="queryEmail" class="form-input" placeholder="ornek@mail.com">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="queryCases()">Sorgula</button>
      </div>
      <div class="status-bar" id="queryStatus"></div>
      <div id="casesListContainer" class="cases-grid"></div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="copyright-text"></div>
</footer>

<!-- Modal: Case Detay -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <h3 class="modal-title">📋 Case Detay</h3>
    <div id="detailContent"></div>
    <div class="row-actions" style="margin-top: 20px; justify-content: flex-end;">
      <button class="btn btn-ghost" onclick="closeModal('detailModal')">Kapat</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
<script src="smtp.js"></script>
<script src="js/theme.js"></script>
<script src="js/common.js"></script>
<script src="js/case.js"></script>
</body>
</html>
