<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Enterprise Case Portal | QA</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<style>
  /* Enterprise ek stiller */
  body {
    background: linear-gradient(145deg, #f1f5f9 0%, #e6edf4 100%);
    font-family: 'Inter', sans-serif;
  }
  .enterprise-card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(2px);
    border-radius: 32px;
    box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.02);
    padding: 32px;
    transition: all 0.2s;
  }
  .enterprise-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .enterprise-logo {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border-radius: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(124,58,237,0.3);
  }
  .enterprise-title {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #1e293b, #2d3a4e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.3px;
  }
  .enterprise-sub {
    color: #475569;
    font-size: 14px;
    margin-top: 8px;
  }
  .form-modern .form-group {
    margin-bottom: 20px;
  }
  .form-modern label {
    font-weight: 600;
    font-size: 13px;
    color: #1e293b;
    letter-spacing: -0.2px;
    margin-bottom: 6px;
    display: block;
  }
  .form-modern .form-input, .form-modern select, .form-modern textarea {
    background: #ffffff;
    border: 1.5px solid #e2e8f0;
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 14px;
    transition: 0.2s;
    width: 100%;
  }
  .form-modern .form-input:focus, .form-modern select:focus, .form-modern textarea:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
    outline: none;
  }
  .btn-enterprise {
    background: linear-gradient(95deg, #7c3aed, #a855f7);
    border: none;
    border-radius: 40px;
    padding: 14px 24px;
    font-weight: 700;
    font-size: 15px;
    width: 100%;
    color: white;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(124,58,237,0.3);
  }
  .btn-enterprise:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 20px -10px rgba(124,58,237,0.5);
  }
  .tabs-enterprise {
    display: flex;
    gap: 12px;
    background: #f8fafc;
    padding: 6px;
    border-radius: 60px;
    margin-bottom: 32px;
  }
  .tab-btn-ent {
    flex: 1;
    background: transparent;
    border: none;
    padding: 10px 16px;
    border-radius: 40px;
    font-weight: 600;
    font-size: 14px;
    color: #475569;
    cursor: pointer;
    transition: 0.2s;
  }
  .tab-btn-ent.active {
    background: white;
    color: #7c3aed;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .status-badge-ent {
    background: #f1f5f9;
    border-radius: 40px;
    padding: 8px 16px;
    font-size: 13px;
    color: #334155;
  }
  @media (max-width: 640px) {
    .enterprise-card { padding: 24px; }
    .enterprise-title { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="main" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
  <div class="enterprise-card">
    <div class="enterprise-header">
      <div class="enterprise-logo">📋</div>
      <div class="enterprise-title">QA Enterprise Case Portal</div>
      <div class="enterprise-sub">Yeni talep, şikayet veya öneri oluşturun — Size özel yönetim paneli</div>
    </div>

    <div class="tabs-enterprise">
      <button class="tab-btn-ent active" data-tab="create">➕ Yeni Case</button>
      <button class="tab-btn-ent" data-tab="query">🔍 Case Sorgula</button>
    </div>

    <!-- Yeni Case -->
    <div id="createTab" class="tab-pane-ent active">
      <div class="form-modern">
        <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group"><label>Adınız Soyadınız *</label><input type="text" id="userFullname" class="form-input"></div>
          <div class="form-group"><label>E-posta *</label><input type="email" id="userEmail" class="form-input"></div>
          <div class="form-group"><label>Konu *</label><select id="caseTopic" class="form-input"></select></div>
          <div class="form-group"><label>Öncelik</label><select id="casePriority" class="form-input"><option value="düşük">Düşük</option><option value="orta" selected>Orta</option><option value="yüksek">Yüksek</option></select></div>
          <div class="form-group full" style="grid-column:1/-1"><label>Başlık *</label><input type="text" id="caseTitle" class="form-input"></div>
          <div class="form-group full" style="grid-column:1/-1"><label>Açıklama *</label><textarea id="caseDesc" rows="4" class="form-input"></textarea></div>
        </div>
        <button class="btn-enterprise" onclick="createCase()">📤 Case Gönder & Bildirim Gönder</button>
        <div id="createStatus" class="status-badge-ent" style="margin-top: 16px; text-align:center;"></div>
      </div>
    </div>

    <!-- Sorgulama -->
    <div id="queryTab" class="tab-pane-ent" style="display:none;">
      <div class="form-modern">
        <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group"><label>Case ID</label><input type="text" id="queryCaseId" class="form-input"></div>
          <div class="form-group"><label>E-posta Adresiniz</label><input type="email" id="queryEmail" class="form-input"></div>
        </div>
        <button class="btn-enterprise" onclick="queryCases()">Sorgula</button>
        <div id="queryStatus" class="status-badge-ent" style="margin-top: 12px;"></div>
        <div id="casesListContainer" class="cases-grid" style="margin-top: 24px;"></div>
      </div>
    </div>
  </div>
</div>

<footer class="footer"><div class="copyright-text">© 2026 QA Portal Enterprise</div></footer>

<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/common.js"></script>
<script src="js/case.js"></script>
<script>
  // Tab geçişleri
  document.querySelectorAll('.tab-btn-ent').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn-ent').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.getAttribute('data-tab');
      document.getElementById('createTab').style.display = tab === 'create' ? 'block' : 'none';
      document.getElementById('queryTab').style.display = tab === 'query' ? 'block' : 'none';
    });
  });
  // URL'den caseId sorgulama
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const caseId = urlParams.get('caseId');
    if (caseId) {
      document.querySelector('.tab-btn-ent[data-tab="query"]').click();
      document.getElementById('queryCaseId').value = caseId;
      setTimeout(() => queryCases(), 200);
    }
  });
</script>
</body>
</html>
