<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Randomizer — QA Portal</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<style>
/* Randomizer özel stiller */
.tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.tab-btn { padding: 8px 20px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-family: var(--font); font-size: 14px; border-radius: 20px; transition: .2s; }
.tab-btn:hover { color: var(--text); background: rgba(255,255,255,.05); }
.tab-btn.active { background: var(--accent2); color: #fff; }
.tab-pane { display: none; animation: fadeIn .3s ease; }
.tab-pane.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.drop-zone { border: 2px dashed var(--border2); border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: .2s; }
.drop-zone:hover, .drop-zone.drag { border-color: var(--accent2); background: rgba(124,109,250,.05); }
.drop-zone.has-file { border-style: solid; border-color: rgba(6,214,160,.4); background: rgba(6,214,160,.04); }
.file-info { display: none; margin-top: 12px; padding: 8px 12px; background: var(--surface); border-radius: 8px; font-size: 12px; }
.file-info.visible { display: flex; align-items: center; justify-content: space-between; }
.manual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
@media (max-width: 600px) { .manual-grid { grid-template-columns: 1fr; } }
.result-display { text-align: center; padding: 30px; background: var(--surface); border-radius: var(--radius); margin-top: 20px; }
.result-number { font-family: var(--display); font-size: 72px; font-weight: 800; background: linear-gradient(135deg, var(--accent2), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: popIn .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result-label { font-size: 13px; color: var(--muted); margin-top: 8px; font-family: var(--mono); }
.log-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.log-item { padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.log-item strong { color: var(--accent2); font-size: 16px; margin-right: 12px; }
</style>
</head>
<body class="grey">

<div class="header">
  <div class="logo">🎲 Randomizer</div>
  <div class="theme-switch"></div>
  <button class="btn btn-ghost" onclick="window.location.href='index.html'">← Ana Sayfa</button>
</div>

<div class="main" style="max-width: 860px;">
  <div class="panel">
    <div class="pt">🎲 Rastgele Seçim Aracı</div>
    <div class="sdesc">Excel/CSV dosyasından rastgele satır seçin veya manuel olarak 1 ile N arasında rastgele sayı üretin.</div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="excel">📂 Excel Randomizer</button>
      <button class="tab-btn" data-tab="manual">🔢 Manuel Randomizer</button>
    </div>

    <!-- Excel Randomizer Tab -->
    <div class="tab-pane active" id="excelTab">
      <div class="drop-zone" id="excelDrop">
        📥 Excel / CSV dosyası sürükleyin veya tıklayın
      </div>
      <input type="file" id="excelFileInput" hidden accept=".csv,.xlsx,.xls">
      <div class="file-info" id="fileInfo">
        <span id="fileName"></span>
        <span id="fileStats"></span>
        <button class="btn btn-ghost btn-sm" id="clearFileBtn" style="padding:2px 8px;">✕ Temizle</button>
      </div>

      <div class="form-group" style="margin-top: 20px;">
        <label>🎧 Dinlenecek Çağrı Sayısı</label>
        <input type="number" id="randomCount" class="form-input" min="1" value="5" style="width: 120px;">
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="randomBtn">🎲 Random Görüşme Seç</button>
        <button class="btn btn-ghost" id="exportBtn" disabled>⬇ Excel Export</button>
      </div>
      <div class="status-bar" id="excelStatus">Bekleniyor…</div>
    </div>

    <!-- Manuel Randomizer Tab -->
    <div class="tab-pane" id="manualTab">
      <div class="manual-grid">
        <div class="form-group">
          <label>Minimum (sabit 1)</label>
          <input type="number" value="1" class="form-input" disabled>
        </div>
        <div class="form-group">
          <label>Maksimum</label>
          <input type="number" id="maxNumber" class="form-input" value="100" min="1">
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="manualBtn">🎯 Kaçıncıyı Dinlemeliyim?</button>
      </div>

      <div class="result-display" id="manualResultBox" style="display: none;">
        <div class="result-number" id="manualResult">-</div>
        <div class="result-label">dinlenecek görüşme sırası</div>
      </div>

      <div class="panel" style="margin-top: 20px;">
        <div class="pt" style="justify-content: space-between;">
          <span>📝 Dinleme Geçmişi</span>
          <button class="btn btn-ghost btn-sm" id="clearLogBtn" style="background: var(--accent3); color: #fff;">🗑 Temizle</button>
        </div>
        <div class="log-list" id="logList">
          <div style="color: var(--muted); text-align: center; padding: 20px;">Henüz seçim yapılmadı.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="copyright-text"></div>
</footer>

<script src="js/theme.js"></script>
<script src="js/common.js"></script>
<script src="js/randomizer.js"></script>
</body>
</html>
